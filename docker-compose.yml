services:
  postgres:
    image: postgres:16-alpine
    container_name: cryptoai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cryptoai
      POSTGRES_PASSWORD: cryptoPassword
      POSTGRES_DB: cryptoai
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptoai -d cryptoai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: cryptoai-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: cryptoai_postgres_data
  redis_data:
    name: cryptoai_redis_data
